# Nex Heuristic Cue Service — Docker Compose
# One container per edge device. Manages all assigned cameras internally.
#
# Staging (no MS-3):
#   STAGING_CAMERA_IDS=4,5  — skips MS-3 lookup, uses org:{org}:base_detection:* pattern
#
# Production edge:
#   Set DEVICE_ID + MS3_URL  — fetches camera list from MS-3 on startup
#   Listens to device:{device_id}:commands for live add_camera / remove_camera
#
# Build:
#   docker build -f Dockerfile.heuristic -t nex/heuristic-cue-service:latest .
# Run staging:
#   docker-compose -f docker-compose.heuristic.yml up

version: "3.9"

services:
  # ── Optional local Redis (remove if using Kenneth's existing instance) ──────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Nex Heuristic Cue Service (all heuristic families, all cameras) ────────
  nex-cue-heuristic:
    image: nex/heuristic-cue-service:latest
    build:
      context: .
      dockerfile: Dockerfile.heuristic
    environment:
      # ── Required ───────────────────────────────────────────────────────────
      REDIS_HOST:           redis
      REDIS_PORT:           "6379"
      ORGANIZATION_ID:      "1"

      # ── Production edge (uncomment + set for real deployment) ──────────────
      # DEVICE_ID:          "your-device-uuid"
      # MS3_URL:            "http://ms3:8000"

      # ── Staging override: skip MS-3, use these camera IDs directly ─────────
      STAGING_CAMERA_IDS:   "4"      # comma-separated e.g. "4,5,6"

      # ── Optional tuning ────────────────────────────────────────────────────
      EMIT_THRESHOLD:       "0.30"   # global min confidence to publish
      FPS_HINT:             "25.0"   # camera FPS for window calibration
      WIDTH_HINT:           "1920"   # frame width hint
      HEIGHT_HINT:          "1080"   # frame height hint
      LOG_LEVEL:            "INFO"   # DEBUG | INFO | WARNING
      CONFIG_PATH:          "configs/config.yaml"

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Kenneth's MS-11 Alert Aggregator (staging only) ───────────────────────
  # microservice-11-alert-aggregator:
  #   image: offtapwatch/microservice-11-alert-aggregator:local
  #   environment:
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     ORGANIZATION_ID: 1
  #   depends_on: [redis]
