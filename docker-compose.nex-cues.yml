# Nex Heuristic Cue Service — Docker Compose (hot-reload enabled)
# One container per edge device. Manages all assigned cameras internally and
# hot-reloads its cue config/model bundle in place via Redis commands (C5).
#
# Reload command channels (subscribed at startup):
#   org:{org}:model_reload          — org-wide reload_model / rollback_model
#   device:{device_id}:commands     — device add_camera / remove_camera / reload_model
#
# Reload payload (published on the channels above):
#   {action: 'reload_model', family: 'physical_instability'|'aggressive_interaction',
#    target: 'heuristic'|'config'|null, model_version, url: 'gs://.../config.yaml',
#    manifest_url: 'gs://.../manifest.json'}
#
# Artifacts (gs:// config.yaml + manifest.json) are fetched with google-cloud-storage,
# so a service-account key is mounted and exposed via GOOGLE_APPLICATION_CREDENTIALS.
# Downloads land in the hotload volume (/app/heuristic_pipeline/hotload).
#
# Build:
#   docker build -f Dockerfile.heuristic -t nex/heuristic-cue-service:latest .
# Run staging:
#   docker-compose -f docker-compose.nex-cues.yml up

version: "3.9"

services:
  # ── Optional local Redis (remove if using Kenneth's existing instance) ──────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Nex Heuristic Cue Service (all heuristic families, all cameras) ────────
  nex-cue-heuristic:
    image: nex/heuristic-cue-service:latest
    build:
      context: .
      dockerfile: Dockerfile.heuristic
    environment:
      # ── Required ───────────────────────────────────────────────────────────
      REDIS_HOST:           redis
      REDIS_PORT:           "6379"
      ORGANIZATION_ID:      "1"

      # ── Production edge (uncomment + set for real deployment) ──────────────
      # DEVICE_ID:          "your-device-uuid"
      # MS3_URL:            "http://ms3:8000"

      # ── Staging override: skip MS-3, use these camera IDs directly ─────────
      STAGING_CAMERA_IDS:   "4"      # comma-separated e.g. "4,5,6"

      # ── Optional tuning ────────────────────────────────────────────────────
      EMIT_THRESHOLD:       "0.30"   # global min confidence to publish
      FPS_HINT:             "25.0"   # camera FPS for window calibration
      WIDTH_HINT:           "1920"   # frame width hint
      HEIGHT_HINT:          "1080"   # frame height hint
      LOG_LEVEL:            "INFO"   # DEBUG | INFO | WARNING
      CONFIG_PATH:          "configs/config.yaml"

      # ── Model hot-reload (C5) ──────────────────────────────────────────────
      # GCS credentials for downloading gs:// config/model bundle artifacts.
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-sa.json"
      # MODEL_VERSION:      "0.1.0"  # optional — initial active config version label

    volumes:
      # Hot-reloaded artifacts (downloaded config.yaml / manifest.json / model bundle).
      - cue-hotload:/app/heuristic_pipeline/hotload
      # GCS service-account key (read-only). Point GOOGLE_APPLICATION_CREDENTIALS at it.
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Kenneth's MS-11 Alert Aggregator (staging only) ───────────────────────
  # microservice-11-alert-aggregator:
  #   image: offtapwatch/microservice-11-alert-aggregator:local
  #   environment:
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     ORGANIZATION_ID: 1
  #   depends_on: [redis]

volumes:
  cue-hotload:
