# Nex Heuristic Cue Service — Docker Compose (Staging)
# Mirrors Kenneth's suggested stub. Works standalone or alongside his MS-11 container.
#
# Usage:
#   docker build -f Dockerfile.heuristic -t nex/heuristic-cue-service:latest .
#   docker-compose -f docker-compose.heuristic.yml up
#
# For edge deployment, set DEVICE_ID and update SUBSCRIBE_CHANNEL accordingly:
#   SUBSCRIBE_CHANNEL=org:1:device:0:base_detection:4

version: "3.9"

services:
  # ── Optional local Redis (remove if using Kenneth's existing instance) ──────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Nex Heuristic Cue Service ─────────────────────────────────────────────
  nex-heuristic-cues:
    image: nex/heuristic-cue-service:latest
    build:
      context: .
      dockerfile: Dockerfile.heuristic
    environment:
      # ── Required ───────────────────────────────────────────────────────────
      REDIS_URL:          redis://redis:6379/0
      ORGANIZATION_ID:    "1"
      CAMERA_ID:          "4"
      SUBSCRIBE_CHANNEL:  org:1:base_detection:4

      # ── Optional overrides ─────────────────────────────────────────────────
      DEVICE_ID:          "0"           # edge only — also update SUBSCRIBE_CHANNEL
      EMIT_THRESHOLD:     "0.30"        # global min confidence to publish
      FPS_HINT:           "25.0"        # used to calibrate windowing (match your camera)
      WIDTH_HINT:         "1920"        # frame width (from frame_shape in MS-1 payload)
      HEIGHT_HINT:        "1080"        # frame height
      LOG_LEVEL:          "INFO"        # DEBUG | INFO | WARNING
      CONFIG_PATH:        "configs/config.yaml"

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Kenneth's MS-11 Alert Aggregator (staging only — remove for production) ─
  # microservice-11-alert-aggregator:
  #   image: offtapwatch/microservice-11-alert-aggregator:local
  #   environment:
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     ORGANIZATION_ID: 1
  #   depends_on: [redis]
